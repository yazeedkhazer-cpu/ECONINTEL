name: ECONINTEL - Read-only ALFRED point-in-time research pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  month-end-asof-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test no-look-ahead handling and conversions
        run: python -m unittest discover -s research/pit -p 'test_*.py' -v
      - name: Retrieve as-of historical series (ALFRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/pit/fetch_pit.py
      - name: Classify with unchanged current labor health engine
        run: node research/pit/classify_pit.cjs
      - name: Upload private research output (no git commits)
        uses: actions/upload-artifact@v4
        with:
          name: ECONINTEL_PIT_Pilot_Results
          path: pit_research_output/
          retention-days: 14
