
name: Update ECONINTEL official data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45 12-22 * * 1-5'
    - cron: '45 15 * * 0,6'

permissions:
  contents: write

concurrency:
  group: econintel-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test official data parsing
        run: python -m unittest discover -s tests -v

      - name: Download official BLS and FRED data
        id: refresh
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_all.py

      - name: Save updated official data
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name "econintel-data-bot"
          git config user.email "econintel-bot@users.noreply.github.com"
          git add assets/official-data.js data/official-latest.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ECONINTEL official datasets"
            git push
          fi
