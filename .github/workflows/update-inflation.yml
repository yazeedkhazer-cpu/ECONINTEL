name: ECONINTEL - Inflation Research Data Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '25 14,20 * * 1-5'
permissions:
  contents: write
concurrency:
  group: econintel-inflation-data
  cancel-in-progress: false
jobs:
  update-inflation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inflation update script
        run: |
          python -m py_compile scripts/update_inflation.py
          python -m unittest discover -s tests -p "test_inflation_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate inflation dashboard logic
        run: |
          node --check assets/inflation.js
          node tests/test_inflation_ui.cjs
          node tests/test_inflation_missing_cpi_yoy.cjs
          node tests/test_inflation_intelligence.cjs
          node --check assets/inflation-forward.js
          node tests/test_inflation_forward.cjs
      - name: Load FRED official inflation and leading series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_inflation.py
      - name: Save inflation data only (never touches labor model)
        run: |
          git config user.name "econintel-inflation-bot"
          git config user.email "econintel-inflation-bot@users.noreply.github.com"
          git add data/inflation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ECONINTEL inflation research observations"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || exit 1
              sleep 3
            done
            exit 1
          fi
