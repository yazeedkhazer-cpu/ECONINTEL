name: "Seal ECONINTEL November inflation pre-release research forecast"
on:
  push:
    branches: [feature/cpi-point-in-time-backtest]
    paths: [".github/workflows/freeze-inflation-forecast.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-inflation-forecast-seal
  cancel-in-progress: false
jobs:
  seal-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cpi-point-in-time-backtest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate no stale, missing or post-release source data can be frozen
        run: |
          node --check research/freeze_next_inflation_nowcast.cjs
          node tests/test_freeze_inflation_nowcast.cjs
      - name: Create new time-stamped and hashed forecast BEFORE BLS BEA releases
        run: node research/freeze_next_inflation_nowcast.cjs
      - name: Commit real before-news forecast to isolated research branch
        run: |
          git config user.name "econintel-prediction-audit-bot"
          git config user.email "econintel-prediction-audit-bot@users.noreply.github.com"
          git add research/forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "Seal dated November 2026 inflation forecast before first release"
            for i in 1 2 3; do
              git pull --rebase origin feature/cpi-point-in-time-backtest || exit 1
              if git push origin HEAD:refs/heads/feature/cpi-point-in-time-backtest; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Attach independently timestamped original forecast JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econintel-november-2026-before-news-forecast-seal
          path: research/forecasts/*.json
          if-no-files-found: warn
          retention-days: 90
