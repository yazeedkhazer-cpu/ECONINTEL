name: "CPI category-vintage walk-forward: Rent OER Lodging"
on:
  push:
    branches: [feature/cpi-point-in-time-backtest]
    paths:
      - ".github/workflows/cpi-category-walkforward.yml"
  pull_request:
    paths:
      - ".github/workflows/cpi-category-walkforward.yml"
      - "research/cpi_category_walkforward.py"
      - "tests/test_cpi_category_walkforward.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  category-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify test-only models and publication-time guardrails
        run: |
          python -m py_compile research/cpi_category_walkforward.py
          python -m unittest discover -s tests -p "test_cpi_category_walkforward.py" -v
      - name: Verify historical data key
        run: |
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY not available"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: .cache/econintel-alfred
          key: ${{ runner.os }}-category-vintage-walkforward-2026-11-v1
      - name: Validate 2024–2026 OER Rent Lodging forecasts from original historical vintages
        run: |
          python research/cpi_category_walkforward.py \
            --events data/shelter-hotel-streak-holdout.json \
            --output data/cpi-category-walkforward.json
      - name: Upload full release-level matched study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpi-category-walkforward-results
          path: data/cpi-category-walkforward.json
          retention-days: 90
          if-no-files-found: warn
